<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Contact Information</legend>
        <div>
        <label for="name">Name:</label>
        <input type="text" id="name">
        </div>

        <div>
        <label for="email">Email:</label>
        <input type="email" id="email">
        </div>
        
        <div>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone">
        </div>
        </fieldset>

        <div>
        <label>
        <label for="color">Color:</label>
        <select id="color">
            <option value="" disabled selected>Select a color</option>
            <option value="Pink">Pink</option>
            <option value="Blue">Blue</option>
            <option value="Green">Green</option>
            <option value="Red">Red</option>
            <option value="Yellow">Yellow</option>
            <option value="Purple">Purple</option>
            <option value="Orange">Orange</option>
            <option value="Brown">Brown</option>
            <option value="Black">Black</option>
            <option value="White">White</option>
            <option value="Gray">Gray</option>
        </select>
        </div>

        <div>
        <label for="size">Size:</label>
        <label for="XS" class="checkbox-label">XS</label>
        <input type="checkbox" name="XS" id="XS">
        <label for="S" class="checkbox-label">S</label>
        <input type="checkbox" name="S" id="S">
        <label for="M" class="checkbox-label">M</label>
        <input type="checkbox" name="M" id="M">
        <label for="L" class="checkbox-label">L</label>
        <input type="checkbox" name="L" id="L">
        <label for="XL" class="checkbox-label">XL</label>
        <input type="checkbox" name="XL" id="XL">
        </div>

        <div>
        <label>Notes:</label>
        <textarea id="notes"></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>
    
</body>
</html>
