<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Form</title>
</head>
<body>
    <form>
        <div>
        <label>Name:</label>
        <input type="text">
        </div>

        <div>
        <label>Email:</label>
        <input type="email">
        </div>
        
        <div>
        <label>Gender:</label>
        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>
        </div>

        <div>
        <label>Favorite Class:</label>
        <select>
            <option label="Math">Math</option>
            <option label="Science">Science</option>
            <option label="History">History</option>
        </select>
        </div>

        <div>
        <label>Skills:</label>
        <input type="checkbox" name="skills" id="html">
        <label for="html">HTML</label>
        <input type="checkbox" name="skills" id="css">
        <label for="css">CSS</label>
        <input type="checkbox" name="skills" id="javascript">
        <label for="javascript">JavaScript</label>
        </div>

        <div>
        <label>Message:</label>
        <textarea></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
